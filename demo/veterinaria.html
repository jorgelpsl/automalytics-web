<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo: Pata Feliz (Veterinaria) — Automalytics</title>
  <meta name="description" content="Ejemplo de sitio web hecho por Automalytics para una clínica veterinaria." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/webp" href="/assets/logo.webp" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0A0C07" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0A0C07; }
    .bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: .7rem 1.25rem; background: #12140D; border-bottom: 1px solid rgba(255,255,255,.08);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .bar a {
      color: #D7FF3F; text-decoration: none; font-weight: 700; font-size: .85rem;
      display: flex; align-items: center; gap: .4rem;
    }
    .bar a:hover { text-decoration: underline; }
    .bar span { color: #888E78; font-size: .78rem; }
    .frame-wrap { height: calc(100% - 47px); }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <div class="bar">
    <a href="/">← Volver a Automalytics</a>
    <span>Demo: Pata Feliz (Veterinaria)</span>
  </div>
  <div class="frame-wrap">
    <iframe src="https://vet-demo.vercel.app" title="Demo del sitio web para Pata Feliz, veterinaria"></iframe>
  </div>
</body>
</html>
