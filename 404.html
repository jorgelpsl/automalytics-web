<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — Automalytics</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/webp" href="assets/logo.webp" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#0A0C07" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0A0C07;
      --cyan: #D7FF3F;
      --white: #F3F5EA;
      --gray: #888E78;
      --lime-ink: #12140A;
    }
    body {
      background: var(--bg); color: var(--white);
      font-family: 'Work Sans', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 2rem 6%; text-align: center;
    }
    .wrap { max-width: 480px; }
    img.mascot { width: 130px; margin-bottom: 1.5rem; }
    .code {
      font-family: 'Sora', sans-serif; font-weight: 900; font-size: 5rem;
      color: var(--cyan); line-height: 1; margin-bottom: .5rem;
    }
    h1 {
      font-family: 'Sora', sans-serif; font-weight: 700; font-size: 1.4rem;
      margin-bottom: .75rem;
    }
    p { color: var(--gray); font-size: .95rem; line-height: 1.6; margin-bottom: 2rem; }
    a.btn {
      display: inline-block; background: var(--cyan); color: var(--lime-ink);
      font-family: 'Sora', sans-serif; font-weight: 700; text-decoration: none;
      padding: .85rem 2rem; border-radius: 50px; font-size: .95rem;
      transition: transform .2s;
    }
    a.btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="mascot" src="assets/mascot.webp" alt="" />
    <p class="code">404</p>
    <h1>Esta página no existe</h1>
    <p>Puede que el link esté roto o que la página se haya movido. Volvamos al inicio.</p>
    <a href="/" class="btn">Volver a Automalytics</a>
  </div>
</body>
</html>
